# Telemetry policy for leddy-mcp-server-modularize. Endpoints and credentials stay in the environment.
version = 1

[server]
enabled = true
service_name = "leddy-mcp-server-modularize"

[server.logging]
enabled = true
level = "info"
console = true
auto_send = false

[server.tracing]
enabled = true
sample_ratio = 1.0
propagators = ["tracecontext", "baggage"]
